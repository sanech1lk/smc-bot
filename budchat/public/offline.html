<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>BudChat — нет соединения</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f1115;
        color: #f3f4f6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .box { max-width: 320px; }
      .icon { font-size: 56px; margin-bottom: 16px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: #9aa1b1; margin: 0; }
      button {
        margin-top: 20px;
        background: #ff7a1a;
        color: #fff;
        border: none;
        padding: 14px 24px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="icon">📡</div>
      <h1>Нет соединения</h1>
      <p>Проверьте интернет на объекте. Загруженные ранее данные останутся доступны офлайн.</p>
      <button onclick="location.reload()">Обновить</button>
    </div>
  </body>
</html>
