services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kelma
      POSTGRES_PASSWORD: kelma
      POSTGRES_DB: kelma
    ports:
      - "5432:5432"
    volumes:
      - kelma_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kelma -d kelma"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # One SENTRY_DSN in .env drives both halves: this bakes it into the
        # browser bundle, the environment block below hands it to the server.
        NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN:-}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kelma:kelma@postgres:5432/kelma?schema=public
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      # Deliberately has no fallback: a placeholder secret here would sign
      # real sessions. Generate one into .env — `openssl rand -base64 32` —
      # and the startup guard in env-guard.js will refuse to boot without it.
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET не задан — сгенерируйте его в .env командой openssl rand -base64 32}
      NODE_ENV: production
      PORT: 3000
      # Push notifications are optional — generate your own with
      # `npx web-push generate-vapid-keys` and set them here, or leave blank.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:support@example.com}
      # Error tracking. Empty = disabled, the app behaves identically.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    ports:
      # Привязано к локальному интерфейсу намеренно: снаружи приложение
      # должно быть доступно только через HTTPS-прокси из
      # docker-compose.prod.yml. Локально по-прежнему http://localhost:3000.
      - "127.0.0.1:3000:3000"
    volumes:
      - kelma_uploads:/app/public/uploads
    healthcheck:
      # Проверяет и веб-сервер, и связь с базой — см. /api/health.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    command: sh -c "npx prisma migrate deploy && node server.js"

volumes:
  kelma_pgdata:
  kelma_uploads:
